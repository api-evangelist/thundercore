generated: '2026-07-21'
method: searched
source: https://docs.developers.thundercore.com/network-details/thundercore-testnet
description: >-
  ThunderCore's sandbox is its public testnet — a full parallel EVM chain with
  its own gas token (TST), chain ID, RPC/WebSocket endpoints, block explorer,
  and faucet. Testnet tokens are separated from mainnet and should never have
  any value. Any Ethereum wallet address works on the testnet.
environments:
  - name: ThunderCore Testnet
    kind: public-testnet
    chain_id: 18
    gas_token: TST
    rpc: https://testnet-rpc.thundercore.com
    websocket: wss://testnet-ws.thundercore.com
    explorer: https://explorer-testnet.thundercore.com
    faucet:
      url: https://faucet-testnet.thundercore.com
      token: TST
      cooldown_seconds: 86400
      docs: https://docs.developers.thundercore.com/tool/tools/faucet
    docs: https://docs.developers.thundercore.com/network-details/thundercore-testnet
test_vs_live:
  separation: >-
    Mainnet (chain ID 108, TT gas token, https://mainnet-rpc.thundercore.com)
    and testnet (chain ID 18, TST gas token, https://testnet-rpc.thundercore.com)
    are entirely separate chains; switching is done by pointing the wallet or
    tooling at the other network's RPC and chain ID.
  notes: >-
    The docs recommend the testnet for developing applications without risking
    real assets, testing against new chain versions, and analyzing blockchain
    data on a smaller data set.
