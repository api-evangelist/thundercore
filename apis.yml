apis:
- name: ThunderCore Mainnet JSON-RPC API
  description: >-
    Ethereum-compatible JSON-RPC 2.0 API for the ThunderCore mainnet (chain ID
    108, TT gas token). Supports the standard eth_/net_/web3_ method surface
    over HTTPS, with WebSocket endpoints for subscriptions; rate limited to
    10K requests/hour on the public endpoint.
  humanURL: https://docs.developers.thundercore.com/network-details/thundercore-mainnet
  baseURL: https://mainnet-rpc.thundercore.com
  tags: [JSON-RPC, EVM, Blockchain, Mainnet]
  properties:
  - type: Documentation
    url: https://docs.developers.thundercore.com/network-details/thundercore-mainnet
  - type: RateLimits
    url: rate-limits/thundercore-rate-limits.yml
- name: ThunderCore Testnet JSON-RPC API
  description: >-
    Ethereum-compatible JSON-RPC 2.0 API for the ThunderCore testnet (chain ID
    18, TST gas token), with a faucet that dispenses TST every 86400 seconds
    for testing DApps without risking real assets.
  humanURL: https://docs.developers.thundercore.com/network-details/thundercore-testnet
  baseURL: https://testnet-rpc.thundercore.com
  tags: [JSON-RPC, EVM, Blockchain, Testnet, Sandbox]
  properties:
  - type: Documentation
    url: https://docs.developers.thundercore.com/network-details/thundercore-testnet
- name: ThunderCore Explorer API (BlockScout)
  description: >-
    Etherscan-compatible REST API (?module=&action=) and ETH RPC API exposed by
    the BlockScout block explorer for the ThunderCore mainnet — accounts,
    transactions, token balances, contract verification, and chain stats.
  humanURL: https://explorer-mainnet.thundercore.com/api-docs
  baseURL: https://explorer-mainnet.thundercore.com/api
  tags: [Explorer, REST, Blockchain, BlockScout]
  properties:
  - type: APIReference
    url: https://explorer-mainnet.thundercore.com/api-docs
  - type: APIReference
    url: https://explorer-mainnet.thundercore.com/eth-rpc-api-docs
- name: ThunderCore Subgraph GraphQL API
  description: >-
    GraphQL query surface over official ThunderCore subgraphs (TTSwap DEX and
    TT Mining) served from ThunderCore's Graph node; third-party subgraph
    deployment is available on request via support@thundercore.com.
  humanURL: https://docs.developers.thundercore.com/tool/tools/subgraph
  baseURL: https://graph-node.thundercore.com/subgraphs/name/ttswap
  tags: [GraphQL, Subgraph, DeFi, Blockchain]
  properties:
  - type: Documentation
    url: https://docs.developers.thundercore.com/tool/tools/subgraph
