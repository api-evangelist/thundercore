aid: thundercore
name: ThunderCore
description: >-
  ThunderCore is an EVM-compatible layer-1 public blockchain with roughly
  one-second block times and single-block finality, using TT as its native gas
  token (chain ID 108). Its external protocol is Ethereum-compatible, so
  standard Ethereum JSON-RPC methods, wallets, and Solidity toolchains
  (Hardhat, Foundry, Truffle, Remix) work against the public RPC and WebSocket
  endpoints, alongside a BlockScout explorer API, official subgraphs on The
  Graph, a cross-chain bridge, and a public testnet with a faucet. Backed by
  Pantera Capital.
